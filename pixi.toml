[workspace]
name = "tandem-numpy"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.14.*"
numpy = ">=2.0"
cython = ">=3.1"
meson-python = ">=0.18"
meson = ">=1.3"
ninja = "*"
pkg-config = "*"
pytest = "*"
pip = "*"
c-compiler = "*"

# The editable install rebuilds the extension on import when sources change.
[pypi-dependencies]
tandem-rng = { path = ".", editable = true }

[pypi-options]
no-build-isolation = ["tandem-rng"]

[tasks]
test = "pytest"
bench = "python tools/bench.py"

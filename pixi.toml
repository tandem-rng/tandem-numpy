[workspace]
name = "tandem-numpy"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.14.*"
numpy = ">=2.0"
cython = ">=3.0"
setuptools = ">=68"
pytest = "*"
pip = "*"
c-compiler = "*"

[pypi-dependencies]
tandem-rng = { path = ".", editable = true }

[tasks]
build = "python setup.py build_ext --inplace"
test = { cmd = "pytest", depends-on = ["build"] }
bench = { cmd = "python tools/bench.py", depends-on = ["build"] }

[build-system]
requires = ["meson-python>=0.18", "Cython>=3.1", "numpy>=2.0"]
build-backend = "mesonpy"

[project]
name = "tandem-rng"
version = "0.1.0"
description = "NumPy BitGenerator for Tandem8x32, a pseudorandom number generator fast on CPUs and GPUs alike"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jessica Cox"}]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Specification = "https://github.com/tandem-rng/spec"
Source = "https://github.com/tandem-rng/tandem-numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
